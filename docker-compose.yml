services:
  # Nginx Reverse Proxy (HTTPS)
  nginx:
    image: nginx:alpine
    container_name: webdashboard-nginx
    ports:
      - "80:80"      # HTTP (redirect to HTTPS)
      - "443:443"    # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Kein direkter Port-Expose mehr (läuft über nginx)
    expose:
      - "4173"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "5m"       # Max 5MB pro Log-Datei
        max-file: "2"        # Maximal 2 Dateien (= 10MB total)

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Kein direkter Port-Expose mehr (läuft über nginx)
    expose:
      - "8000"
    environment:
      # Holt sich die Werte jetzt aus der .env-Datei
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # Max 10MB pro Log-Datei
        max-file: "3"        # Maximal 3 Dateien (= 30MB total)
        compress: "true"     # Alte Logs komprimieren

  db:
    image: postgres:16
    container_name: webdashboard-db
    restart: always
    environment:
      # Holt sich die Werte jetzt aus der .env-Datei
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/ssl/server.crt:/var/lib/postgresql/server.crt:ro
      - ./db/ssl/server.key:/var/lib/postgresql/server.key:ro
    command: [
      "postgres",
      "-c", "ssl=on",
      "-c", "ssl_cert_file=/var/lib/postgresql/server.crt",
      "-c", "ssl_key_file=/var/lib/postgresql/server.key"
    ]
    # Keine externe Portfreigabe, nur intern im Docker-Netzwerk erreichbar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # Max 10MB pro Log-Datei
        max-file: "3"        # Maximal 3 Dateien (= 30MB total)

volumes:
  postgres_data:
