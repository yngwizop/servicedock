services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:4173"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "5m"       # Max 5MB pro Log-Datei
        max-file: "2"        # Maximal 2 Dateien (= 10MB total)

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Holt sich die Werte jetzt aus der .env-Datei
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # Max 10MB pro Log-Datei
        max-file: "3"        # Maximal 3 Dateien (= 30MB total)
        compress: "true"     # Alte Logs komprimieren

  db:
    image: postgres:16
    container_name: webdashboard-db
    restart: always
    environment:
      # Holt sich die Werte jetzt aus der .env-Datei
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # Max 10MB pro Log-Datei
        max-file: "3"        # Maximal 3 Dateien (= 30MB total)

volumes:
  postgres_data:
