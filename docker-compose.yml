# Servicedock — Docker Hub images (production install)
# Usage: setup-servicedock.sh, then: docker compose pull && docker compose up -d
# SSL: nginx/ssl/cert.pem + key.pem | Postgres: db/ssl/server.crt + server.key (UID 999)

x-log-small: &log-small
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

x-log-backend: &log-backend
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

x-security-ro: &security-ro
  security_opt:
    - no-new-privileges:true
  read_only: true

x-health-nginx: &health-nginx
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://127.0.0.1/"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s

x-health-frontend: &health-frontend
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

x-health-backend: &health-backend
  test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/\")' || exit 1'"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

x-health-db: &health-db
  test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

x-health-redis: &health-redis
  test: ["CMD", "redis-cli", "ping"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=require
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env e.g. https://dashboard.example.com}
  ENVIRONMENT: production
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  MAX_FAILED_LOGIN_ATTEMPTS: ${MAX_FAILED_LOGIN_ATTEMPTS:-5}
  LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
  TRUST_FORWARDED_HEADERS: ${TRUST_FORWARDED_HEADERS:-true}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
  PROXMOX_HOST_ALLOWLIST: ${PROXMOX_HOST_ALLOWLIST:-}

services:
  nginx:
    image: ${DOCKERHUB_USER:?Set DOCKERHUB_USER in .env}/servicedock-nginx:latest
    container_name: servicedock-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: always
    healthcheck: *health-nginx
    logging: *log-small

  frontend:
    image: ${DOCKERHUB_USER}/servicedock-frontend:latest
    container_name: servicedock-frontend
    expose:
      - "80"
    <<: *security-ro
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
      - /tmp
    depends_on:
      - backend
    restart: always
    healthcheck: *health-frontend
    logging: *log-small

  backend:
    image: ${DOCKERHUB_USER}/servicedock-backend:latest
    container_name: servicedock-backend
    expose:
      - "8000"
    environment: *backend-env
    <<: *security-ro
    volumes:
      - wallpaper_uploads:/app/uploads
    tmpfs:
      - /tmp
      - /app/__pycache__:uid=1000,gid=1000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    healthcheck: *health-backend
    logging: *log-backend

  migrate:
    profiles: ["migrations"]
    image: ${DOCKERHUB_USER}/servicedock-backend:latest
    container_name: servicedock-migrate
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
    command: ["bash", "-lc", "cd /app && alembic -c alembic.ini upgrade head"]

  db:
    image: postgres:16
    container_name: servicedock-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/ssl/server.crt:/var/lib/postgresql/server.crt:ro
      - ./db/ssl/server.key:/var/lib/postgresql/server.key:ro
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/server.key
    healthcheck: *health-db
    logging: *log-backend

  redis:
    image: redis:7-alpine
    container_name: servicedock-redis
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: *health-redis
    logging: *log-small

volumes:
  postgres_data:
  wallpaper_uploads:
